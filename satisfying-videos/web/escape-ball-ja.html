<title>脱出ボール</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
<style>
  /* Layout: one vertical 9:16 "phone video" frame centered on a deep stage. Single dark look by choice. */
  :root {
    --stage: #07060f;
    --frame: #0d0b1f;
    --ink: #f4f0ff;
    --muted: #9a93c7;
    --hot: #ff5fa2;
    --display: "Dela Gothic One", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--stage);
    color: var(--ink);
    font-family: var(--display);
    display: flex; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
    overflow: hidden;
  }
  #wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 1px #221d48, 0 30px 80px #000a; background: var(--frame); }
  canvas { display: block; width: 100%; height: 100%; }
  #start {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: flex-end; padding-bottom: 12%;
    background: linear-gradient(transparent 55%, #07060fcc);
    border: 0; color: var(--ink); font: inherit; cursor: pointer;
  }
  #start span.btn {
    background: var(--hot); color: #1a0716; padding: 14px 26px; border-radius: 999px;
    font-size: 18px; letter-spacing: .04em; box-shadow: 0 0 30px #ff5fa288;
  }
  #start span.sub { color: var(--muted); font-family: system-ui, sans-serif; font-size: 13px; }
  #start:focus-visible span.btn { outline: 3px solid var(--ink); outline-offset: 3px; }
  #mute {
    position: absolute; right: 12px; bottom: 12px; background: #ffffff14; color: var(--ink);
    border: 1px solid #ffffff2a; border-radius: 999px; padding: 6px 12px; font: 12px system-ui, sans-serif; cursor: pointer;
  }
  #mute:focus-visible { outline: 2px solid var(--ink); }
  [hidden] { display: none !important; }
</style>

<div id="wrap">
  <div id="frame">
    <canvas id="c" aria-label="何重ものリングを内側から突き破っていくボールのアニメーション"></canvas>
    <button id="start" type="button" aria-label="音ありで再生">
      <span class="btn">▶ タップで再生（音あり）</span>
      <span class="sub">全部突破するまで自動でループします</span>
    </button>
    <button id="mute" type="button" hidden>🔊 音オン</button>
  </div>
</div>

<script>
(() => {
  const W = 540, H = 960;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const frame = document.getElementById('frame');
  const wrap = document.getElementById('wrap');

  function fit() {
    const aw = wrap.clientWidth, ah = wrap.clientHeight;
    let h = ah, w = h * 9 / 16;
    if (w > aw) { w = aw; h = w * 16 / 9; }
    frame.style.width = w + 'px'; frame.style.height = h + 'px';
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  addEventListener('resize', fit); fit();
  const base = () => ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);

  // ---------- Audio ----------
  let ac = null, master = null, muted = false;
  function initAudio() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ac.createDynamicsCompressor();
    master = ac.createGain(); master.gain.value = 0.7;
    const delay = ac.createDelay(); delay.delayTime.value = 0.16;
    const fb = ac.createGain(); fb.gain.value = 0.3;
    const wet = ac.createGain(); wet.gain.value = 0.35;
    master.connect(comp); master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(comp);
    comp.connect(ac.destination);
  }
  function pluck(freq, vol = 0.3, dur = 0.45, t0 = 0) {
    if (!ac || muted) return;
    const t = ac.currentTime + t0;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(master);
    [['triangle', 1, 1], ['sine', 2, 0.4], ['sine', 3, 0.12]].forEach(([type, mul, lv]) => {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = freq * mul;
      const og = ac.createGain(); og.gain.value = lv; o.connect(og); og.connect(g);
      o.start(t); o.stop(t + dur + 0.05);
    });
  }
  function boom(size = 1) {
    if (!ac || muted) return;
    const t = ac.currentTime;
    // sub thump
    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.35);
    const og = ac.createGain(); og.gain.setValueAtTime(0.6 * size, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(og); og.connect(master); o.start(t); o.stop(t + 0.5);
    // glass shatter noise
    const len = ac.sampleRate * 0.7;
    const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500;
    const g = ac.createGain(); g.gain.value = 0.35 * size;
    src.connect(f); f.connect(g); g.connect(master); src.start(t);
  }
  const PENTA = [0, 2, 4, 7, 9];
  const st = s => 2 ** (s / 12);

  // ---------- World ----------
  const C = { x: W / 2, y: H * 0.52 };
  const N_RINGS = 10, R0 = 46, DR = 21, GAP = 0.72;
  const BR = 8;
  let rings, ball, cur, bounces, ringBounces, state, stateT, parts, trail, flash, shake, zoom, best = 0, total = 0;

  function reset() {
    rings = [];
    for (let i = 0; i < N_RINGS; i++) {
      rings.push({
        r: R0 + i * DR,
        ang: Math.random() * Math.PI * 2,
        w: (i % 2 ? -1 : 1) * (1.0 + i * 0.12),
        gap: GAP,
        hue: (300 + i * 26) % 360,
        alive: true,
      });
    }
    ball = { x: C.x, y: C.y - 10, vx: (Math.random() * 2 - 1) * 200, vy: -80, passing: false };
    cur = 0; bounces = 0; ringBounces = 0; state = 'play'; stateT = 0;
    parts = []; trail = []; flash = 0; shake = 0;
    zoom = targetZoom();
  }
  const targetZoom = () => {
    if (state === 'done') return 1;
    const r = rings[Math.min(cur, N_RINGS - 1)].r;
    return Math.min(3.2, Math.max(1, 175 / r));
  };

  const G = 620;
  function shatter(ring) {
    const n = Math.round(ring.r * 0.9);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const rel = Math.atan2(Math.sin(a - ring.ang), Math.cos(a - ring.ang));
      if (Math.abs(rel) < ring.gap / 2) continue;
      const s = 80 + Math.random() * 380;
      parts.push({
        x: C.x + Math.cos(a) * ring.r, y: C.y + Math.sin(a) * ring.r,
        vx: Math.cos(a) * s + (Math.random() - .5) * 120, vy: Math.sin(a) * s + (Math.random() - .5) * 120,
        life: 1.3, max: 1.3, hue: ring.hue, sz: 2 + Math.random() * 3.5, shard: true, rot: Math.random() * 6, vr: (Math.random() - .5) * 20,
      });
    }
  }

  function step(dt) {
    stateT += dt;
    for (const r of rings) r.ang += r.w * dt;
    flash = Math.max(0, flash - dt * 3);
    shake = Math.max(0, shake - dt * 3);
    zoom += (targetZoom() - zoom) * Math.min(1, dt * 2.2);

    if (state === 'done' && stateT > 4) reset();

    ball.vy += G * dt;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;

    if (state === 'play') {
      const ring = rings[cur];
      const dx = ball.x - C.x, dy = ball.y - C.y, dist = Math.hypot(dx, dy) || 0.001;
      if (!ball.passing && dist + BR >= ring.r) {
        const ang = Math.atan2(dy, dx);
        const rel = Math.atan2(Math.sin(ang - ring.ang), Math.cos(ang - ring.ang));
        const half = ring.gap / 2 - Math.asin(Math.min(1, BR / ring.r));
        if (Math.abs(rel) < half && ball.vx * dx + ball.vy * dy > 0) {
          ball.passing = true;
        } else {
          const nx = dx / dist, ny = dy / dist;
          const dot = ball.vx * nx + ball.vy * ny;
          if (dot > 0) {
            ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny;
            const kick = (Math.random() * 2 - 1) * 60;
            ball.vx += -ny * kick; ball.vy += nx * kick;
            const sp = Math.hypot(ball.vx, ball.vy);
            const target = Math.min(900, Math.max(sp * 1.01, 300 + cur * 35));
            ball.vx *= target / sp; ball.vy *= target / sp;
            bounces++; ringBounces++;
            if (ringBounces > 14) ring.gap = Math.min(1.6, ring.gap + 0.05); // keep pace
            const k = (ringBounces - 1) % 10;
            pluck(220 * st(cur * 2 + 12 * Math.floor(k / 5) + PENTA[k % 5]), 0.26);
            ring.hit = 1;
            for (let i = 0; i < 7; i++) {
              const a = Math.atan2(-ny, -nx) + (Math.random() - 0.5) * 1.8, s = 60 + Math.random() * 180;
              parts.push({ x: C.x + nx * ring.r, y: C.y + ny * ring.r, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45, max: 0.45, hue: ring.hue, sz: 1.5 + Math.random() * 2 });
            }
          }
          const over = dist + BR - ring.r;
          ball.x -= nx_(dx, dist) * over; ball.y -= dy / dist * over;
        }
      }
      if (ball.passing && dist - BR > ring.r + 1) {
        // ring broken!
        ring.alive = false; ball.passing = false; ringBounces = 0;
        shatter(ring);
        flash = 1; shake = 0.6 + cur * 0.06;
        boom(0.6 + cur * 0.05);
        const root = 261.63 * st(cur * 2);
        [0, 4, 7, 12].forEach((s, i) => pluck(root * st(s), 0.22, 1.0, i * 0.045));
        cur++;
        // push outward a little so it feels like breaking through
        const nx = dx / dist, ny = dy / dist;
        ball.vx += nx * 120; ball.vy += ny * 120;
        if (cur >= N_RINGS) {
          state = 'done'; stateT = 0; total = bounces; best = Math.max(best, 1);
          shake = 1.6;
          setTimeout(() => {
            [0, 4, 7, 11, 14, 19, 24].forEach((s, i) => pluck(392 * st(s), 0.25, 2.2, i * 0.08));
            boom(1.4);
          }, 120);
          for (let i = 0; i < 160; i++) {
            const a = Math.random() * Math.PI * 2, s = 150 + Math.random() * 900;
            parts.push({ x: ball.x, y: ball.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 2, max: 2, hue: Math.random() * 360, sz: 2 + Math.random() * 5 });
          }
        }
      }
    }

    for (const r of rings) r.hit = Math.max(0, (r.hit || 0) - dt * 4);
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 30) trail.shift();
    for (const p of parts) { p.vy += 380 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.rot != null) p.rot += p.vr * dt; }
    parts = parts.filter(p => p.life > 0);
  }
  const nx_ = (dx, dist) => dx / dist;

  // ---------- Render ----------
  function draw() {
    base();
    ctx.fillStyle = '#0d0b1f'; ctx.fillRect(0, 0, W, H);
    const curHue = rings[Math.min(cur, N_RINGS - 1)].hue;
    const bg = ctx.createRadialGradient(C.x, C.y, 20, C.x, C.y, 600);
    bg.addColorStop(0, `hsla(${curHue},80%,35%,${0.28 + flash * 0.35})`); bg.addColorStop(1, 'rgba(13,11,31,0)');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // camera
    ctx.save();
    let sx = 0, sy = 0;
    if (shake > 0) { sx = (Math.random() - .5) * 18 * shake; sy = (Math.random() - .5) * 18 * shake; }
    ctx.translate(C.x + sx, C.y + sy); ctx.scale(zoom, zoom); ctx.translate(-C.x, -C.y);

    // rings
    ctx.lineCap = 'round';
    for (let i = N_RINGS - 1; i >= 0; i--) {
      const r = rings[i];
      if (!r.alive) continue;
      const active = i === cur;
      const lw = (active ? 6 : 4.5) / Math.sqrt(zoom) + (r.hit || 0) * 3;
      ctx.shadowColor = `hsl(${r.hue},95%,62%)`; ctx.shadowBlur = active ? 22 + (r.hit || 0) * 30 : 8;
      ctx.strokeStyle = `hsla(${r.hue},90%,${active ? 66 + (r.hit || 0) * 25 : 58}%,${active ? 1 : 0.75})`;
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.arc(C.x, C.y, r.r, r.ang + r.gap / 2, r.ang + Math.PI * 2 - r.gap / 2); ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // trail
    trail.forEach((t, i) => {
      const k = i / trail.length;
      ctx.fillStyle = `rgba(255,255,255,${k * 0.28})`;
      ctx.beginPath(); ctx.arc(t.x, t.y, BR * (0.3 + 0.7 * k), 0, Math.PI * 2); ctx.fill();
    });
    // ball
    if (!(state === 'done' && stateT > 0.05)) {
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 24;
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, BR, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // particles
    for (const p of parts) {
      const a = p.life / p.max;
      ctx.fillStyle = `hsla(${p.hue},95%,${60 + a * 20}%,${a})`;
      if (p.shard) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.sz * 1.6, -p.sz * 0.5, p.sz * 3.2, p.sz);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * (a + .3), 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();

    // white flash
    if (flash > 0.6) { ctx.fillStyle = `rgba(255,255,255,${(flash - 0.6) * 0.5})`; ctx.fillRect(0, 0, W, H); }

    // HUD
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = 9; ctx.strokeStyle = '#0d0b1f';
    ctx.font = '30px "Dela Gothic One", "Hiragino Sans", sans-serif'; ctx.fillStyle = '#f4f0ff';
    const q = state === 'done' ? '全部突破！！' : `${N_RINGS}枚 全部ぶち破れる？`;
    ctx.strokeText(q, W / 2, 78); ctx.fillText(q, W / 2, 78);

    // progress pips
    const pw = 26, gapx = 8, startX = W / 2 - (N_RINGS * pw + (N_RINGS - 1) * gapx) / 2;
    for (let i = 0; i < N_RINGS; i++) {
      const done = i < cur;
      ctx.fillStyle = done ? `hsl(${rings[i].hue},90%,62%)` : 'rgba(255,255,255,0.14)';
      ctx.fillRect(startX + i * (pw + gapx), 112, pw, 7);
    }

    if (state === 'done') {
      const pop = 1 + Math.max(0, 0.4 - stateT) * 1.2;
      ctx.save(); ctx.translate(W / 2, H - 150); ctx.scale(pop, pop);
      ctx.font = '42px "Dela Gothic One", "Hiragino Sans", sans-serif'; ctx.fillStyle = '#ff5fa2';
      ctx.strokeText(`${total}バウンドで脱出`, 0, 0); ctx.fillText(`${total}バウンドで脱出`, 0, 0);
      ctx.restore();
    } else {
      ctx.font = '20px "Dela Gothic One", "Hiragino Sans", sans-serif'; ctx.fillStyle = '#f4f0ff';
      const cap = cur >= N_RINGS - 2 ? 'あと少し…！' : cur >= 5 ? '加速してきた…' : `残り ${N_RINGS - cur} 枚`;
      ctx.strokeText(cap, W / 2, H - 120); ctx.fillText(cap, W / 2, H - 120);
    }
  }

  reset();
  let last = performance.now(), running = false;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const S = 5; for (let i = 0; i < S; i++) step(dt / S);
    draw();
    requestAnimationFrame(loop);
  }

  draw();
  const startBtn = document.getElementById('start'), muteBtn = document.getElementById('mute');
  startBtn.addEventListener('click', () => {
    initAudio(); if (ac.state === 'suspended') ac.resume();
    startBtn.hidden = true; muteBtn.hidden = false;
    if (!running) { running = true; reset(); last = performance.now(); requestAnimationFrame(loop); }
  });
  muteBtn.addEventListener('click', () => {
    muted = !muted; muteBtn.textContent = muted ? '🔇 音オフ' : '🔊 音オン';
  });
  addEventListener('resize', () => { if (!running) draw(); });
  document.fonts && document.fonts.ready.then(() => { if (!running) draw(); });
})();
</script>
